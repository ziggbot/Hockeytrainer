name: Nattlig databasbackup

# Logical backup of the Neon database, encrypted before it leaves the runner.
# The repository is public, so the artifact must never contain plain data.
# Needs repository secrets BACKUP_DATABASE_URL and BACKUP_PASSPHRASE (docs/DEPLOY.md).
# Scheduled runs only happen on the default branch.

on:
  schedule:
    - cron: '17 2 * * *' # every night 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backup skipped: add the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets (see docs/DEPLOY.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump database
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # pg_dump should use Neon's direct endpoint, not the PgBouncer pooler.
          export PGURL="${DATABASE_URL/-pooler./.}"
          # pg_dump 18 can dump any older server version.
          docker run --rm -e PGURL postgres:18-alpine \
            sh -c 'pg_dump --format=custom --no-owner --no-acl "$PGURL"' > backup.dump
          test -s backup.dump
          # Sanity check: the archive is readable and lists our tables.
          docker run --rm -i postgres:18-alpine pg_restore --list < backup.dump | grep -q 'TABLE public practices'
          echo "Dump size: $(du -h backup.dump | cut -f1)"

      - name: Encrypt
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          out="hockeytrainer-$(date -u +%Y%m%d-%H%M).dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$out" backup.dump <<< "$BACKUP_PASSPHRASE"
          rm -f backup.dump
          ls -l "$out"

      - name: Upload encrypted backup
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: hockeytrainer-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
